name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"] # release.yml handles tag pushes
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang

      - name: Setup Jerry
        uses: jeffscottbrown/jerry-lang/.github/actions/setup-jerry@v0.2.2
        with:
          version: v0.2.2

      - name: Jerry version
        run: jerry --version

      - name: Unit tests
        run: cd src && jerry test grep.jer grep_test.jer

      - name: Build
        run: jerry compile src/grep.jer src/main.jer -o gdgrep

      - name: Test — basic match
        run: printf 'apple\nbanana\napricot\n' | ./gdgrep ap

      - name: Test — no match exits 1
        run: |
          printf 'apple\nbanana\n' | ./gdgrep mango && exit 1 || true

      - name: Test — line numbers (-n)
        run: |
          OUT=$(printf 'foo\nbar\nfoo\n' | ./gdgrep -n foo)
          echo "$OUT"
          echo "$OUT" | grep -q '^1:foo'
          echo "$OUT" | grep -q '^3:foo'

      - name: Test — ignore case (-i)
        run: |
          OUT=$(printf 'Hello\nworld\n' | ./gdgrep -i hello)
          echo "$OUT"
          echo "$OUT" | grep -q 'Hello'

      - name: Test — combined flags (-i -n)
        run: |
          OUT=$(printf 'Apple\nbanana\nAPPLE\n' | ./gdgrep -i -n apple)
          echo "$OUT"
          echo "$OUT" | grep -q '^1:Apple'
          echo "$OUT" | grep -q '^3:APPLE'

      - name: Test — multiple files show label
        run: |
          OUT=$(./gdgrep fn src/grep.jer src/main.jer)
          echo "$OUT"
          echo "$OUT" | grep -q 'src/grep.jer:'
          echo "$OUT" | grep -q 'src/main.jer:'

      - name: Test — single file no label
        run: |
          OUT=$(./gdgrep fn src/main.jer)
          echo "$OUT"
          echo "$OUT" | grep -vq 'src/main.jer:'
