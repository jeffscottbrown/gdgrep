name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"] # release.yml handles tag pushes
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang

      - name: Setup Jerry
        uses: jeffscottbrown/jerry-lang/.github/actions/setup-jerry@v0.8.3
        with:
          version: v0.8.3

      - name: Jerry version
        run: jerry --version

      - name: Build
        run: make build

      - name: Test
        run: make test
